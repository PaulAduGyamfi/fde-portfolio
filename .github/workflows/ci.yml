name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r 01-caseflow-agent/requirements.txt
      - run: pytest -q
        working-directory: 01-caseflow-agent

  eval:
    # The eval calls a real model, so it costs money and needs a key.
    # It runs only when the key is present, and never blocks a fork's PR.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r 01-caseflow-agent/requirements.txt
      - run: pytest -q
        working-directory: 01-caseflow-agent
        env:
          OPENAI_API_KEY: not-used-tests-monkeypatch-the-model
          API_KEY: not-used-tests-only
      - name: extraction eval (gated)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ci-not-used
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "no model key available — skipping the eval gate"
            exit 0
          fi
          python run_extraction_eval.py --gate | tee eval_ci.txt
        working-directory: 01-caseflow-agent/evals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-output
          path: 01-caseflow-agent/evals/eval_ci.txt